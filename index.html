<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A personal tier list for movies, books, and series.">
  <meta name="theme-color" content="#151718">
  <title>TierShelf</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <header class="topbar">
    <div class="frame nav">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name">TierShelf</span></a>
      <div class="account"><span id="mode" class="mode">Demo mode</span><button id="account-button" class="button">Dymon login</button></div>
    </div>
  </header>
  <main class="frame">
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">The archive<span>.</span></h1>
        <p id="description">Rank the movies, books, and series you finish.</p>
        <button id="add-button" class="button primary"><span aria-hidden="true">+</span> Add title</button>
      </div>
      <figure class="cookie-banner">
        <img src="/danisa-cookie-tier-list.webp" alt="Danisa butter cookie tier list, with chocolate chip in S tier and spools of sewing thread in E tier" width="761" height="790">
      </figure>
    </section>
    <section aria-label="Tier list">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter by media type">
          <button data-filter="movie" aria-pressed="true">Movies</button>
          <button data-filter="book" aria-pressed="false">Books</button>
          <button data-filter="anime" aria-pressed="false">Series</button>
        </div>
        <details id="category-filter" class="category-filter">
          <summary id="category-filter-label">Categories</summary>
          <div class="filter-panel">
            <label>Match <select id="category-match"><option value="all">All selected</option><option value="any">Any selected</option></select></label>
            <button id="clear-categories" class="button" type="button">Clear</button>
            <div id="filter-options" class="category-options"></div>
            <div id="movie-filters"></div>
          </div>
        </details>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search titles" aria-label="Search titles"></label>
      </div>
      <div class="board-meta"><span id="count"></span><span id="hint">Drag titles between tiers</span></div>
      <div id="board" class="board"></div>
      <p id="status" class="status" role="status"></p>
    </section>
    <footer><span id="footer-text">Demo edits reset when you refresh or close this tab.</span></footer>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="entry-form">
      <div class="dialog-heading"><h2 id="editor-title">Add title</h2><button type="button" class="icon-button" id="close-editor" aria-label="Close editor">×</button></div>
      <label>Title<input id="entry-title" maxlength="200" required autocomplete="off"></label>
      <div class="fields">
        <label>Type<select id="entry-type"><option value="movie">Movie</option><option value="book">Book</option><option value="anime">Series</option></select></label>
        <label>Tier<select id="entry-grade"></select></label>
      </div>
      <fieldset id="entry-artwork">
        <legend id="artwork-legend">Poster</legend>
        <label>Wikipedia page <input id="entry-wikipedia" type="url" maxlength="2000" placeholder="Optional — look up by title"></label>
        <button id="find-poster" type="button" class="button">Find poster</button>
        <label id="poster-options-field" hidden><span id="poster-options-label">Did you mean?</span><select id="poster-options"></select></label>
        <button id="match-poster-title" type="button" class="button" hidden>Match title</button>
        <label>Poster image URL <input id="entry-poster" type="url" maxlength="2000" placeholder="Optional direct image URL"></label>
        <label>Alternative poster URL <input id="alternative-poster" type="url" maxlength="2000" placeholder="Optional direct image URL"></label>
        <div class="poster-choices">
          <button id="select-poster" class="poster-choice" type="button" aria-pressed="false" hidden>
            <img id="poster-preview" alt="">
            <span>Primary</span>
          </button>
          <button id="select-alternative" class="poster-choice" type="button" aria-pressed="false" hidden>
            <img id="alternative-preview" alt="">
            <span>Alternative</span>
          </button>
        </div>
        <p id="poster-status" role="status"></p>
      </fieldset>
      <fieldset id="entry-details">
        <legend>Details</legend>
        <button id="autofill-details" class="button" type="button">Autofill details</button>
        <p id="autofill-status" role="status"></p>
        <label id="entry-author-field" hidden>Author <input id="entry-author" maxlength="200" autocomplete="off"></label>
        <label>Release year <input id="entry-year" type="number" min="1" max="9999" step="1"></label>
        <fieldset id="movie-details" class="category-picker" hidden>
          <legend>Movie details</legend>
          <div id="movie-fields" class="movie-fields"></div>
        </fieldset>
        <fieldset class="category-picker">
          <legend id="category-legend">Categories</legend>
          <div id="entry-categories" class="category-options"></div>
          <div class="inline-field">
            <input id="new-category" maxlength="48" aria-label="New category name" placeholder="New category">
            <button id="add-category" type="button" class="button">Add</button>
          </div>
        </fieldset>
      </fieldset>
      <p id="editor-status" role="status"></p>
      <div class="form-actions"><button type="button" id="delete-button" class="button danger" hidden>Delete</button><button type="submit" id="save-button" class="button primary">Save title</button></div>
    </form>
  </dialog>
  <dialog id="login-dialog" aria-labelledby="login-title">
    <div class="dialog-heading"><h2 id="login-title">Dymon mode</h2><button type="button" class="icon-button" id="close-login" aria-label="Close login">×</button></div>
    <p id="login-description">Sign in with GitHub to open your private archive.</p>
    <button class="button primary" id="github-login">Continue with GitHub</button>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
